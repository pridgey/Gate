name: Build APK

# Every push: unit tests + debug APK (run artifact).
# Pushes to main also publish a GitHub Release with the APK attached.

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Name APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "gates-$VERSION.apk"

      # Uploaded unzipped, so the download is the installable APK itself.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: gates-*.apk
          archive: false
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "gates-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Gates $VERSION" \
            --notes "Debug build of ${GITHUB_SHA::7}: $(git log -1 --format=%s)

          Install the APK, then set Gates as your default home app. Builds share one signing key, so each one installs over the last."
