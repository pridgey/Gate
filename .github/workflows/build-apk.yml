name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK after the commit
        run: mv app/build/outputs/apk/debug/app-debug.apk "gates-debug-${GITHUB_SHA::7}.apk"

      # Uploaded unzipped, so the download is the installable APK itself.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: gates-debug-*.apk
          archive: false
          if-no-files-found: error
